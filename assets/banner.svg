<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card/Glassmorphism Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }

    /* CSS Animations */
    @keyframes pulse-orb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.7; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -60; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: pulse-orb 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: pulse-orb 10s ease-in-out infinite 2s; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 6; animation: dash-flow 3s linear infinite; }
    .node-1 { animation: float-node 4s ease-in-out infinite; }
    .node-2 { animation: float-node 5s ease-in-out infinite 1s; }
    .node-3 { animation: float-node 4.5s ease-in-out infinite 2s; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs (Background layer) -->
  <circle class="orb-1" cx="950" cy="120" r="180" fill="url(#glow-grad)" filter="url(#glow)"/>
  <circle class="orb-2" cx="200" cy="300" r="150" fill="url(#glow-grad)" filter="url(#glow)"/>

  <!-- Dynamic Grid Network Background -->
  <g opacity="0.15">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M200,0 V400 M400,0 V400 M600,0 V400 M800,0 V400 M1000,0 V400" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Animated Connection Flows (Middle Layer) -->
  <g opacity="0.6">
    <path class="flow-line" d="M 750 140 Q 880 180 980 130" stroke="#8b5cf6" stroke-width="2" fill="none"/>
    <path class="flow-line" d="M 750 200 Q 890 220 1000 270" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <path class="flow-line" d="M 750 260 Q 860 300 950 330" stroke="#ec4899" stroke-width="2" fill="none"/>
  </g>

  <!-- Interactive/Dynamic Nodes (Right Side Background Element) -->
  <g class="node-1">
    <rect x="940" y="100" width="130" height="44" rx="22" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1005" y="127" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">📧 Email</text>
  </g>
  <g class="node-2">
    <rect x="970" y="180" width="130" height="44" rx="22" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="1035" y="207" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">📱 Push &amp; SMS</text>
  </g>
  <g class="node-3">
    <rect x="920" y="260" width="140" height="44" rx="22" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="990" y="287" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 In-App &amp; Web</text>
  </g>

  <!-- Foreground Content Block (Guaranteed Clear Foreground Visibility) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="82" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="98" r="5" fill="#38bdf8"/>
    <text x="30" y="103" class="badge-text">CURATED ECOSYSTEM • 2026</text>

    <!-- Main Title -->
    <text x="0" y="170" class="title">Awesome Multi-Channel</text>
    <text x="0" y="220" class="title" fill="url(#primary-grad)">Customer Engagement</text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">SaaS Platforms, Open-Source Automation &amp; Notification Infrastructure</text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="305" width="480" height="4" rx="2" fill="url(#primary-grad)"/>
  </g>
</svg>
